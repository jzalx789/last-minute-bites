name: Prototype acceptance
on: [push, pull_request]
jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: python -m unittest discover -s tests -v
      - run: node --check static/app.js && node --check static/mobile.js && node --check static/sw.js
      - run: pip install playwright==1.62.0 Pillow==13.0.0
      - run: python -m playwright install --with-deps chromium webkit
      - run: pip install --require-hashes -r requirements-deploy.txt
      - run: python tests/deployment_smoke.py
      - name: Browser acceptance
        run: |
          export LMB_TEST_CHROMIUM="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          python tests/browser_smoke.py
          LMB_TEST_WEBKIT=1 python tests/mobile_acceptance.py
