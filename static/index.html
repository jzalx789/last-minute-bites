<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#173E2C" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Last Minute Bites</title>
    <link rel="stylesheet" href="/style.css" />
    <script src="/vendor/jsQR.js" defer></script>
    <script src="/vendor/qrcode.js" defer></script>
    <script src="/mobile.js" defer></script>
    <script src="/notifications.js" defer></script>
    <script src="/app.js" defer></script>
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <div id="app">
      <main id="main"><p>Loading Last Minute Bites…</p></main>
    </div>
    <div id="toast" role="status" aria-live="polite"></div>
    <dialog id="confirm">
      <form method="dialog">
        <h2 id="confirm-title"></h2>
        <p id="confirm-message"></p>
        <label id="confirm-label" hidden
          ><span id="confirm-input-label"></span
          ><input id="confirm-input" autocomplete="off"
        /></label>
        <div class="actions">
          <button value="cancel" id="confirm-cancel"></button
          ><button class="primary" value="yes" id="confirm-yes"></button>
        </div>
      </form>
    </dialog>
    <dialog id="agreement-dialog" aria-labelledby="agreement-dialog-title">
      <form method="dialog" data-agreement-recovery>
        <h2 id="agreement-dialog-title"></h2>
        <p id="agreement-dialog-note"></p>
        <div id="agreement-dialog-links"></div>
        <label class="check"><input type="checkbox" name="accepted" required><span id="agreement-dialog-label"></span></label>
        <p id="agreement-dialog-error" class="error" role="alert"></p>
        <div class="actions"><button type="submit" value="cancel" formnovalidate id="agreement-dialog-cancel"></button><button type="submit" value="accept" class="primary" id="agreement-dialog-accept"></button></div>
      </form>
    </dialog>
    <dialog id="scanner" aria-labelledby="scanner-title">
      <h2 id="scanner-title">Scan invitation / 掃描邀請</h2>
      <p id="scanner-status" role="status"></p>
      <video id="qr-video" autoplay playsinline muted></video>
      <div class="actions">
        <button id="scanner-close" type="button">Close / 關閉</button
        ><button id="scanner-retry" type="button">Retry / 重試</button>
      </div>
    </dialog>
    <dialog id="used-picker" aria-labelledby="used-title">
      <form method="dialog">
        <h2 id="used-title"></h2>
        <p id="used-note"></p>
        <div id="used-foods"></div>
        <p id="used-error" class="error" role="alert"></p>
        <div class="actions">
          <button id="used-cancel" value="cancel" formnovalidate></button
          ><button id="used-confirm" class="primary" value="confirm"></button>
        </div>
      </form>
    </dialog>
    <noscript
      >This application requires JavaScript and an internet
      connection.</noscript
    >
  </body>
</html>
